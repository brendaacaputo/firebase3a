<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=s, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        p {
            padding: 1.5px 0 0;
        }

        #bloco_texto {
            display: flex;
            flex-direction: column;
            text-align: right;

        }

        #conteiner_inputs2 {
            display: flex;
        }

        #conteiner_inputs {
            display: flex;
            flex-direction: column;
        }

        #bloco_a {
            flex-direction: column;
        }

        #bloco_b {
            display: flex;
        }

        #bloco_b1 {
            flex-direction: column;
        }

        #bloco_b2 {
            flex-direction: column;
            justify-content: flex-end;
            padding: 60px 0 0;
        }
    </style>
    <script>
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAgoqQcIHhaKATqm8a_PQRN_NtJTMQevcw",
  authDomain: "endereco-6b11b.firebaseapp.com",
  projectId: "endereco-6b11b",
  storageBucket: "endereco-6b11b.firebasestorage.app",
  messagingSenderId: "495013042338",
  appId: "1:495013042338:web:ff01d5532275f2f07e1ffb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formulario");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const cep = document.getElementById("cep").value;
      const endereco = document.getElementById("endereco").value;
      const complemento1 = document.getElementById("complemento1").value;
      const cidade = document.getElementById("cidade").value;
      const telefone1 = document.getElementById("telefone1").value;
      const telefone2 = document.getElementById("telefone2").value;
      const celular = document.getElementById("celular").value;
      const fax = document.getElementById("fax").value;
      const bairro = document.getElementById("bairro").value;
      const complemento2 = document.getElementById("complemento").value;
      const complemento3 = document.getElementById("complemento").value;
      const complemento4 = document.getElementById("complemento").value;
      const complemento5 = document.getElementById("complemento").value;

      try {
        await addDoc(collection(db, "usuarios"), {
          cep,
          endereco,
          complemento1,
          cidade,
          telefone1,
          telefone2,
          celular,
          fax,
          complemento2,
          complemento3,
          complemento4,
          complemento5
        });

        mensagem.textContent = "Endereço salvo com sucesso.";
        mensagem.style.color = "green";
        form.reset();
      } catch (error) {
        mensagem.textContent = "Erro ao salvar: " + error.message;
        mensagem.style.color = "red";
      }
    });
    </script>
</head>

<body>
    <main>
        <form action="">
            <fieldset>
                <legend>Cadastro</legend>
                
                <div id="conteiner_inputs">
                    <div id="conteiner_inputs2">
                        <div id="bloco_texto">
                            <p>CEP: </p>
                            <p>Endereço: </p>
                            <p>Complemento: </p>
                            <p>Cidade: </p>
                            <p>Telefone1: </p>
                            <p>Telefone2: </p>
                            <p>Celular:</p>
                            <p>Fax: </p>
                        </div>
                        <div id="bloco_a">
                            <input type="text" id="cep" minlength="12" placeholder="80525-000"><br> 
                            <input type="text" id="endereco" maxlength="150" placeholder="rua baroxoque 259, cidadao pele"><br> 
                            <input type="text" id="complemento1" maxlength="350" placeholder="bloco de endereço cidadania"><br> 
                            <input type="text" id="cidade" maxlength="350" placeholder="bloco de endereço cidadania"> <br> 
                            <input type="tel" id="telefone1" minlength="14" placeholder="+55 41 9557-7696"> <br> 
                            <input type="tel" id="telefone2" minlength="14"placeholder="+55 41 9545-7696"> <br> 
                            <input type="tel" id="celular" minlength="14"placeholder="+55 41 99557-7696"> <br> 
                            <input type="tel" id="fax" minlength="14"placeholder="+55 41 7745-7696"><br>
                        </div>

                        <div id="bloco_b">
                            <div id="bloco_b1">

                            </div>
                            <div id="bloco_b2">
                                Bairro: <input type="text" id="bairro" placeholder="Bairro" maxlength="150"><br>
                                <button id="lupa">lupa</button><button id="borracha">apagar</button><br> 
                                Complemento: <input type="text" id="complemento2" maxlength="150"><br> 
                                Complemento: <input type="text" id="complemento3" maxlength="150"><br> 
                                Complemento: <input type="text" id="complemento4" maxlength="150"><br>
                                Complemento: <input type="text" id="complemento5" maxlength="150"><br>
                            </div>
                        </div>
                    </div>
                </div>
                <input type="submit" value="Cadastrar">
        </fieldset>
        </form>
        
    </main>
</body>

</html>
